<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promotion Request</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#14302b;--mut:#5b726c;--line:#d6e0dd;--brand:#0e6f61;--soft:#e4f1ee;--bad:#b42318;--warn:#b54708;--ok:#067647}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif}
header{background:var(--ink);color:#fff;display:flex;gap:6px;align-items:center;padding:0 16px;flex-wrap:wrap}
header b{font-weight:600;margin-right:14px;padding:12px 0}header button{background:none;border:0;color:#bfd6d0;padding:14px 12px;cursor:pointer;font:inherit;border-bottom:3px solid transparent}
header button.on{color:#fff;border-color:#5fd1bd}header .sp{flex:1}header small{color:#bfd6d0}
main{max-width:1040px;margin:20px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:19px}h3{margin:18px 0 8px;font-size:15px}
label{display:block;font-weight:500;margin:10px 0 4px}label.i{display:flex;gap:8px;align-items:center;font-weight:400;margin:4px 0}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
input[type=checkbox],input[type=radio]{width:auto}textarea{min-height:80px}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 12px}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
.btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:500;cursor:pointer}
.btn.s{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.r{background:var(--bad)}.btn.sm{padding:5px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500}tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}
.tw{overflow-x:auto}.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--soft);color:var(--brand)}
.tag.rejected{background:#fde7e4;color:var(--bad)}.tag.draft{background:#eee;color:#555}.tag.approved,.tag.closed{background:#dcf5e8;color:var(--ok)}.tag.excom{background:#fdeed9;color:var(--warn)}
.flt{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}@media(max-width:640px){.flt{grid-template-columns:1fr}}
.flow{display:flex;margin:6px 0 16px}.flow div{flex:1;text-align:center;font-size:13px;color:var(--mut);padding-top:16px;position:relative}
.flow div:before{content:"";position:absolute;top:4px;left:0;right:0;height:4px;background:var(--line)}
.flow .d:before{background:var(--brand)}.flow .c{color:var(--ink);font-weight:600}.flow .c:before{background:var(--brand);height:8px;top:2px}
.flow .x:before{background:var(--bad);height:8px;top:2px}.flow .x{color:var(--bad);font-weight:600}.flow .k:before{background:repeating-linear-gradient(90deg,var(--line) 0 6px,#fff 6px 10px)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px}.kv span:nth-child(odd){color:var(--mut)}
.hist{border-left:3px solid var(--line);padding-left:12px;margin:8px 0}.mut{color:var(--mut)}.err{color:var(--bad)}
.imgs a{display:inline-block;margin:4px 6px 0 0;font-size:13px}.imgs img{height:70px;border-radius:6px;border:1px solid var(--line);display:block}
.login{max-width:360px;margin:60px auto}
</style></head><body><div id="app"></div>
<script>
// ===== ตั้งค่า Supabase =====
const SUPABASE_URL='https://https://azmgtzycxmxquggkdewd.supabase.co', sb_publishable_O0WSj11yL-BXxR3Xft3NuQ_6SxqLt45';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const PROCS=['การจัดฟันปกติ (Metal Braces)','การจัดฟันใส','การทำรีเทนเนอร์','ขูดหินปูน','Air Flow','การตรวจสุขภาพช่องปาก','การทำวีเนียร์ (Veneer)','การทำฟันปลอม','การฟอกสีฟัน Zoom','การฟอกสีฟันในคลินิก','การอุดฟัน','ความสวยงาม'];
const ROLES={admin:'ผู้ดูแลระบบ',requester:'ผู้ร้องขอ (PMO/ตัวแทนหมอ)',branch_manager:'Branch manager',head:'หัวหน้างาน',rom:'ROM',marketing:'Marketing',excom_pom:'EXCOM อจ.ป้อม',excom_nueng:'EXCOM พี่หนึ่ง',cfo:'CFO',ceo:'CEO',dentcloud:'Dentcloud Expert',viewer:'ผู้รับแจ้ง (ดูอย่างเดียว)'};
const ST={draft:'ร่าง',head_review:'รอหัวหน้างาน',marketing:'รอ Marketing',excom:'รอ EXCOM',approved:'อนุมัติแล้ว',closed:'ปิดเคส (โปรเดิม)',rejected:'ไม่อนุมัติ'};
const INFORM=['rom','cfo','dentcloud','viewer'];
let me=null,view='track',rows=[],apps=[],cur=null,edit=null,flt={q:'',s:'',b:''};
const $=i=>document.getElementById(i);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'-';
const tag=s=>`<span class="tag ${s}">${ST[s]||s}</span>`;
const is=r=>me.role==='admin'||r;
const needEx=r=>r.is_influencer?['cfo','ceo']:['excom_pom','excom_nueng'];
function canAct(r){
  if(r.status==='head_review')return me.role==='admin'||(r.requester_role==='branch_manager'?me.role==='rom':me.role==='head');
  if(r.status==='marketing')return ['admin','marketing'].includes(me.role);
  if(r.status==='excom')return needEx(r).includes(me.role)&&!apps.some(a=>a.request_id===r.id&&a.step==='excom'&&a.actor_role===me.role);
  return false}
const canCreate=()=>['admin','requester','branch_manager','rom','marketing'].includes(me.role);

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return loginView();
  const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  me=data;view='track';await shell()}
function loginView(msg=''){
  $('app').innerHTML=`<div class="card login"><h2>Promotion Request</h2>
  <label>อีเมล</label><input id="em" type="email"><label>รหัสผ่าน</label><input id="pw" type="password">
  <p class="err">${e(msg)}</p><div class="row"><button class="btn" onclick="login()">เข้าสู่ระบบ</button><button class="btn s" onclick="signup()">สมัครใช้งาน</button></div>
  <p class="mut">หลังสมัคร ให้แจ้งผู้ดูแลระบบเพื่อกำหนดบทบาทของคุณ</p></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});error?loginView('เข้าสู่ระบบไม่สำเร็จ: '+error.message):boot()}
async function signup(){const {error}=await sb.auth.signUp({email:$('em').value,password:$('pw').value});error?loginView(error.message):loginView('สมัครแล้ว กรุณายืนยันอีเมล (ถ้าเปิดไว้) แล้วเข้าสู่ระบบ')}
async function load(){
  rows=(await sb.from('requests').select('*').order('created_at',{ascending:false})).data||[];
  apps=(await sb.from('approvals').select('request_id,step,actor_role,action')).data||[]}
async function shell(){
  await load();const n=rows.filter(canAct).length;
  const nav=[['track','ติดตามคำขอ'],canCreate()&&['new','สร้างคำขอ'],['inbox','รออนุมัติ'+(n?` (${n})`:'')],me.role==='admin'&&['users','ผู้ใช้']].filter(Boolean);
  $('app').innerHTML=`<header><b>Promotion Request</b>${nav.map(([k,t])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${t}</button>`).join('')}<span class="sp"></span><small>${e(me.name||me.email)} · ${ROLES[me.role]}</small><button onclick="sb.auth.signOut().then(()=>loginView())">ออก</button></header><main id="m"></main>`;
  ({track:trackView,inbox:()=>trackView(true),new:formView,users:usersView,detail:detailView})[view]()}
const go=v=>{view=v;edit=null;shell()};

// ===== ติดตาม + ค้นหา + Excel =====
function filtered(inbox){const q=flt.q.toLowerCase();
  return rows.filter(r=>(!inbox||canAct(r))&&(!flt.s||r.status===flt.s)&&(!flt.b||(r.branch||'').toLowerCase().includes(flt.b.toLowerCase()))&&(!q||[r.req_no,r.title,r.branch,r.requester_name,r.objective].join(' ').toLowerCase().includes(q)))}
function trackView(inbox){
  const l=filtered(inbox===true);
  $('m').innerHTML=`<div class="card"><h2>${inbox===true?'รออนุมัติจากคุณ':'ติดตามคำขอ'}</h2>
  <div class="flt"><input id="fq" placeholder="ค้นหา เลขที่ / ชื่อโปร / ผู้ขอ" value="${e(flt.q)}"><select id="fs"><option value="">ทุกสถานะ</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${flt.s===k?'selected':''}>${v}</option>`).join('')}</select><input id="fb" placeholder="สาขา" value="${e(flt.b)}"><button class="btn s" onclick="exportX(${inbox===true})">โหลด Excel</button></div>
  <div class="tw"><table><thead><tr><th>เลขที่</th><th>ชื่อโปร</th><th>สาขา</th><th>ผู้ขอ</th><th>สถานะ</th><th>วันที่ยื่น</th></tr></thead><tbody>
  ${l.map(r=>`<tr onclick="openD('${r.id}')"><td>${e(r.req_no)}</td><td>${e(r.title)}</td><td>${e(r.branch)}</td><td>${e(r.requester_name)}</td><td>${tag(r.status)}</td><td>${fd(r.created_at)}</td></tr>`).join('')||'<tr><td colspan=6 class="mut">ไม่พบรายการ</td></tr>'}</tbody></table></div></div>`;
  const re=()=>{flt={q:$('fq').value,s:$('fs').value,b:$('fb').value};const p=$('fq').selectionStart;trackView(inbox)};
  ['fq','fb'].forEach(i=>$(i).oninput=()=>{flt={q:$('fq').value,s:$('fs').value,b:$('fb').value};trackView(inbox);const x=$(i);x.focus();x.setSelectionRange(99,99)});
  $('fs').onchange=re}
function exportX(inbox){
  const d=filtered(inbox).map(r=>({'เลขที่':r.req_no,'ชื่อโปร':r.title,'สาขา':r.branch,'ผู้ขอ':r.requester_name,'ประเภท':r.promo_type==='repeat'?'โปรเดิม (ด่วน)':'โปรใหม่','Influencer':r.is_influencer?'ใช่':'','หัตถการ':[...(r.procedures||[]),r.procedure_other].filter(Boolean).join(', '),'หมอประกัน':r.insurance_doctor,'เริ่ม':r.start_date,'สิ้นสุด':r.end_date,'สถานะ':ST[r.status],'Dentcloud Code':r.dc_code,'วันที่ยื่น':r.created_at?.slice(0,10)}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d),'Requests');XLSX.writeFile(wb,'promotion-requests.xlsx')}

// ===== ฟอร์มผู้ร้องขอ =====
function formView(){
  const r=edit||{procedures:[],attachments:[],promo_type:'new'};
  $('m').innerHTML=`<div class="card"><h2>${r.id?'แก้ไขคำขอ '+e(r.req_no):'สร้างคำขอโปรโมชั่น'}</h2>
  <label>ชื่อโปรโมชั่น *</label><input id="f_title" value="${e(r.title)}">
  <div class="g2"><div><label>สาขา *</label><input id="f_branch" value="${e(r.branch||me.branch)}" placeholder="เช่น สาขาสยาม หรือ ทุกสาขา"></div>
  <div><label>ประเภทคำขอ</label><select id="f_type"><option value="new" ${r.promo_type==='new'?'selected':''}>โปรใหม่ (ผ่าน EXCOM)</option><option value="repeat" ${r.promo_type==='repeat'?'selected':''}>โปรที่เคยอนุมัติแล้ว (flow ด่วน)</option></select></div>
  <div><label>วันที่เริ่ม</label><input type="date" id="f_s" value="${r.start_date||''}"></div><div><label>วันที่สิ้นสุด</label><input type="date" id="f_e" value="${r.end_date||''}"></div></div>
  <label class="i"><input type="checkbox" id="f_inf" ${r.is_influencer?'checked':''}> เป็นโปรโมชั่น Influencer (อนุมัติโดย CFO & CEO)</label>
  <label>วัตถุประสงค์</label><textarea id="f_obj">${e(r.objective)}</textarea>
  <h3>ประเภทหัตถการ</h3><div class="g3">${PROCS.map(p=>`<label class="i"><input type="checkbox" class="pc" value="${e(p)}" ${(r.procedures||[]).includes(p)?'checked':''}> ${p}</label>`).join('')}</div>
  <label>หัตถการอื่น ๆ (พิมพ์เอง)</label><input id="f_po" value="${e(r.procedure_other)}">
  <div class="g2"><div><label>หมอประกัน</label><input id="f_ins" value="${e(r.insurance_doctor)}"></div></div>
  <label>ราคา / รายละเอียดโปรโมชั่น</label><textarea id="f_price">${e(r.price_detail)}</textarea>
  <label>เงื่อนไขเพิ่มเติม</label><textarea id="f_cond">${e(r.conditions)}</textarea>
  <label>เอกสารแนบ (รูปตัวอย่าง Gift Voucher, Memo ฯลฯ)</label><input type="file" id="f_files" multiple accept="image/*,.pdf,.doc,.docx">
  <div class="imgs">${files(r.attachments)}</div>
  <p class="err" id="fe"></p><div class="row"><button class="btn s" onclick="saveReq(false)">บันทึกไว้ก่อน (Save draft)</button><button class="btn" onclick="saveReq(true)">ส่งให้หัวหน้างาน</button></div></div>`}
function files(a){return (a||[]).map(f=>`<a href="${e(f.url)}" target="_blank">${/\.(png|jpe?g|gif|webp)$/i.test(f.name)?`<img src="${e(f.url)}" alt="">`:''}${e(f.name)}</a>`).join('')}
async function upload(input,old){
  const out=[...(old||[])];
  for(const f of input?.files||[]){const p=`${me.id}/${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`;
    const {error}=await sb.storage.from('attachments').upload(p,f);if(error)throw error;
    out.push({name:f.name,url:sb.storage.from('attachments').getPublicUrl(p).data.publicUrl})}
  return out}
async function saveReq(send){
  const t=$('f_title').value.trim(),b=$('f_branch').value.trim();
  if(!t||(send&&!b))return $('fe').textContent='กรุณากรอกชื่อโปรโมชั่นและสาขา';
  try{
    const o=edit||{};
    const v={title:t,branch:b,promo_type:$('f_type').value,is_influencer:$('f_inf').checked,start_date:$('f_s').value||null,end_date:$('f_e').value||null,objective:$('f_obj').value,
      procedures:[...document.querySelectorAll('.pc:checked')].map(x=>x.value),procedure_other:$('f_po').value,insurance_doctor:$('f_ins').value,price_detail:$('f_price').value,conditions:$('f_cond').value,
      attachments:await upload($('f_files'),o.attachments),status:send?'head_review':'draft',updated_at:new Date().toISOString()};
    const q=o.id?sb.from('requests').update(v).eq('id',o.id).select().single():sb.from('requests').insert({...v,requester_id:me.id,requester_name:me.name||me.email,requester_role:me.role}).select().single();
    const {data,error}=await q;if(error)throw error;
    openD(data.id)}catch(x){$('fe').textContent=x.message}}

// ===== รายละเอียด + อนุมัติ =====
async function openD(id){await load();cur=rows.find(r=>r.id===id);view='detail';await shell()}
async function detailView(){
  const r=cur,h=(await sb.from('approvals').select('*').eq('request_id',r.id).order('created_at')).data||[];
  const steps=[['draft','ร่าง'],['head_review','หัวหน้างาน'],['marketing','Marketing'],['excom','EXCOM'],['approved','อนุมัติ']];
  const idx=r.status==='closed'?4:r.status==='rejected'?-1:steps.findIndex(s=>s[0]===r.status);
  const rejAt=h.filter(a=>a.action==='reject').pop()?.step;
  const fl=steps.map(([k,t],i)=>{let c='';
    if(r.status==='rejected')c=k===rejAt?'x':(steps.findIndex(s=>s[0]===rejAt)>i?'d':'');
    else if(r.status==='closed'&&k==='excom')c='k';else if(i<idx||r.status==='approved')c='d';else if(i===idx)c='c';
    return `<div class="${c}">${t}${c==='x'?' (ไม่อนุมัติ)':''}</div>`}).join('');
  const act=canAct(r),mine=r.requester_id===me.id||me.role==='admin';
  const done=['approved','closed'].includes(r.status);
  $('m').innerHTML=`<div class="card"><div class="row" style="margin:0 0 8px"><h2 style="margin:0">${e(r.title)}</h2>${tag(r.status)}<span class="mut">${e(r.req_no)}</span></div>
  <div class="flow">${fl}</div>
  <div class="kv"><span>สาขา</span><span>${e(r.branch)}</span><span>ผู้ขอ</span><span>${e(r.requester_name)} (${ROLES[r.requester_role]||''})</span>
  <span>ประเภท</span><span>${r.promo_type==='repeat'?'โปรเดิม (flow ด่วน)':'โปรใหม่'}${r.is_influencer?' · Influencer':''}</span>
  <span>ระยะเวลา</span><span>${fd(r.start_date)} – ${fd(r.end_date)}</span><span>วัตถุประสงค์</span><span>${e(r.objective)}</span>
  <span>หัตถการ</span><span>${e([...(r.procedures||[]),r.procedure_other].filter(Boolean).join(', '))}</span><span>หมอประกัน</span><span>${e(r.insurance_doctor)||'-'}</span>
  <span>ราคา/รายละเอียด</span><span>${e(r.price_detail)}</span><span>เงื่อนไข</span><span>${e(r.conditions)}</span><span>เอกสารแนบ</span><span class="imgs">${files(r.attachments)||'-'}</span></div>
  <h3>ประวัติการพิจารณา</h3>${h.map(a=>`<div class="hist"><b>${e(a.actor_name)}</b> <span class="mut">${ROLES[a.actor_role]||''} · ${fd(a.created_at)}</span><br>${a.action==='reject'?'<span class="err">ไม่อนุมัติ</span>':'อนุมัติ/ผ่าน'}${a.comment?': '+e(a.comment):''}</div>`).join('')||'<p class="mut">ยังไม่มี</p>'}
  <div class="row"><button class="btn s" onclick="go('track')">กลับ</button>${r.status==='draft'&&mine?`<button class="btn" onclick="edit=cur;view='new';shell()">แก้ไข / ส่งคำขอ</button>`:''}</div></div>
  ${act?actPanel(r):''}${done?postPanel(r):''}`}
function actPanel(r){
  const mk=r.status==='marketing',ex=r.status==='excom',hd=r.status==='head_review';
  return `<div class="card"><h2>การพิจารณาของคุณ</h2>
  ${mk&&r.promo_type==='new'?`<label class="i"><input type="checkbox" id="pres"> ผู้ร้องขอได้ present ให้ EXCOM เรียบร้อยแล้ว (จำเป็นก่อนส่งเข้า EXCOM)</label>`:''}
  ${mk&&r.promo_type==='repeat'?'<p class="mut">โปรเดิมที่เคยอนุมัติ: กดอนุมัติแล้วปิดเคสได้เลย ไม่ต้องส่งถึงผู้บริหาร</p>':''}
  <label>${hd?'ความเห็นหัวหน้างาน (ไม่บังคับ)':'ความเห็น (บังคับถ้าไม่อนุมัติ)'}</label><textarea id="cm"></textarea>
  <div class="row"><button class="btn" onclick="act('approve')">${hd?'OK ส่งต่อ Marketing':'อนุมัติ'}</button>${hd?'':'<button class="btn r" onclick="act(\'reject\')">ไม่อนุมัติ (Reject)</button>'}</div></div>`}
async function act(kind){
  const r=cur,c=$('cm').value.trim(),step=r.status;let patch={};
  if(kind==='reject'&&!c)return alert('กรุณาระบุเหตุผลที่ไม่อนุมัติ');
  if(kind==='reject')patch.status='rejected';   // reject หยุดที่คนปฏิเสธ ไม่ไปต่อ EXCOM
  else if(step==='head_review')patch.status='marketing';
  else if(step==='marketing'){
    if(r.promo_type==='repeat')patch.status='closed';
    else{if(!$('pres').checked)return alert('ต้องยืนยันว่าผู้ร้องขอได้ present ให้ EXCOM แล้ว');patch={status:'excom',presented:true}}}
  else if(step==='excom'){
    const got=new Set(apps.filter(a=>a.request_id===r.id&&a.step==='excom'&&a.action==='approve').map(a=>a.actor_role));got.add(me.role);
    if(needEx(r).every(x=>got.has(x)))patch.status='approved'}
  const a=await sb.from('approvals').insert({request_id:r.id,step,actor_id:me.id,actor_name:me.name||me.email,actor_role:me.role,action:kind,comment:c});
  if(a.error)return alert(a.error.message);
  if(patch.status)await sb.from('requests').update({...patch,updated_at:new Date().toISOString()}).eq('id',r.id);
  openD(r.id)}

// ===== หลังอนุมัติ: Dentcloud + Memo + แจ้งฝ่ายที่เกี่ยวข้อง =====
function postPanel(r){
  const dc=['admin','dentcloud'].includes(me.role),rom=['admin','rom'].includes(me.role);
  return `<div class="card"><h2>Dentcloud Expert</h2>
  <div class="g2"><div><label>Code ใน Dentcloud</label><input id="dc_code" value="${e(r.dc_code)}" ${dc?'':'disabled'}></div><div></div>
  <div><label>DF</label><input id="dc_df" value="${e(r.dc_df)}" ${dc?'':'disabled'}></div><div><label>CF</label><input id="dc_cf" value="${e(r.dc_cf)}" ${dc?'':'disabled'}></div></div>
  <div class="imgs">${files(r.dc_images)}</div>${dc?`<label>แนบรูปกลับ</label><input type="file" id="dc_files" multiple accept="image/*"><div class="row"><button class="btn" onclick="saveDC()">บันทึก Dentcloud</button></div>`:''}</div>
  <div class="card"><h2>Memo ถึงสาขา</h2><textarea id="memo" style="min-height:190px" ${rom?'':'disabled'}>${e(r.memo)}</textarea>
  <div class="row">${rom?`<button class="btn s" onclick="genMemo()">สร้างข้อความ Memo</button><button class="btn" onclick="saveMemo()">บันทึก Memo</button>`:''}<button class="btn s" onclick="navigator.clipboard.writeText($('memo').value)">คัดลอก</button><button class="btn s" onclick="informMail()">ส่งอีเมลแจ้งฝ่ายที่เกี่ยวข้อง</button></div></div>`}
async function saveDC(){
  const r=cur,imgs=await upload($('dc_files'),r.dc_images);
  await sb.from('requests').update({dc_code:$('dc_code').value,dc_df:$('dc_df').value,dc_cf:$('dc_cf').value,dc_images:imgs}).eq('id',r.id);openD(r.id)}
function genMemo(){const r=cur;
  $('memo').value=`Memo: โปรโมชั่น ${r.title}\nเลขที่คำขอ: ${r.req_no}\nสาขา: ${r.branch}\nระยะเวลา: ${fd(r.start_date)} – ${fd(r.end_date)}\nหัตถการ: ${[...(r.procedures||[]),r.procedure_other].filter(Boolean).join(', ')}\nรายละเอียด: ${r.price_detail||'-'}\nเงื่อนไข: ${r.conditions||'-'}\nDentcloud Code: ${r.dc_code||'-'}\n\nขอให้ทุกสาขาที่เกี่ยวข้องดำเนินการตามรายละเอียดข้างต้น`}
async function saveMemo(){await sb.from('requests').update({memo:$('memo').value}).eq('id',cur.id);alert('บันทึกแล้ว')}
async function informMail(){
  const {data}=await sb.from('profiles').select('email,role');const r=cur;
  const to=[...new Set((data||[]).filter(p=>INFORM.includes(p.role)).map(p=>p.email))];
  const rq=(await sb.from('profiles').select('email').eq('id',r.requester_id).single()).data;if(rq)to.push(rq.email);
  location.href=`mailto:${to.join(',')}?subject=${encodeURIComponent('อนุมัติโปรโมชั่น '+r.req_no+' '+r.title)}&body=${encodeURIComponent($('memo').value||('โปรโมชั่น '+r.title+' ได้รับการอนุมัติแล้ว'))}`}

// ===== จัดการผู้ใช้ (admin) =====
async function usersView(){
  const {data}=await sb.from('profiles').select('*').order('created_at');
  $('m').innerHTML=`<div class="card"><h2>ผู้ใช้และบทบาท</h2><div class="tw"><table><thead><tr><th>อีเมล</th><th>ชื่อ</th><th>สาขา</th><th>บทบาท</th></tr></thead><tbody>${(data||[]).map(p=>`<tr style="cursor:default"><td>${e(p.email)}</td>
  <td><input value="${e(p.name)}" onchange="upd('${p.id}',{name:this.value})"></td><td><input value="${e(p.branch)}" onchange="upd('${p.id}',{branch:this.value})"></td>
  <td><select onchange="upd('${p.id}',{role:this.value})">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${p.role===k?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`}
const upd=(id,v)=>sb.from('profiles').update(v).eq('id',id);
boot();
</script></body></html>
