<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promotion Request System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2433;--mute:#667085;--line:#e4e7ec;--brand:#0f766e;--brand-d:#0b5d57;--brand-l:#e6f4f2;--warn:#b45309;--warn-l:#fef3c7;--danger:#c0392b;--danger-l:#fdecea;--ok:#15803d;--ok-l:#dcfce7;--info:#1d4ed8;--info-l:#e0e7ff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
h1,h2,h3{margin:0}
a{color:var(--brand);text-decoration:none}
.mute{color:var(--mute)}
.r{text-align:right}
/* login */
#login-screen{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--card);padding:32px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(16,24,40,.08)}
.login-card h1{font-size:22px;margin-bottom:4px}
.login-card .err{color:var(--danger);min-height:20px;margin:8px 0}
/* topbar */
.topbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 24px;height:56px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.brand{font-weight:700;color:var(--brand);font-size:16px;white-space:nowrap}
.topbar nav{display:flex;gap:4px;flex:1}
.topbar nav a{padding:8px 14px;border-radius:8px;color:var(--mute);font-weight:500}
.topbar nav a.active,.topbar nav a:hover{background:var(--brand-l);color:var(--brand)}
.user{display:flex;align-items:center;gap:10px;font-size:13px}
main{max-width:1180px;margin:0 auto;padding:24px}
/* ui */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:12px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:20px}
.page-head p{margin:2px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:500;display:inline-block}
.btn:hover{background:#f9fafb}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{border:0;background:none;cursor:pointer;color:var(--danger);font-size:16px}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-l);border-color:var(--brand)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-weight:500;font-size:13px;margin-bottom:4px}
.field{margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid .span2{grid-column:span 2}
@media(max-width:600px){.grid .span2{grid-column:auto}main{padding:12px}}
.filters{display:flex;gap:10px;margin-bottom:12px}
.filters input{max-width:320px}.filters select{max-width:200px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
tbody tr[data-id]{cursor:pointer}
tbody tr[data-id]:hover{background:#f9fafb}
.tblwrap{overflow-x:auto}
.empty{text-align:center;color:var(--mute);padding:40px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.draft{background:#eef0f3;color:#475467}
.badge.pending{background:var(--warn-l);color:var(--warn)}
.badge.approved{background:var(--ok-l);color:var(--ok)}
.badge.rejected{background:var(--danger-l);color:var(--danger)}
.alert{padding:12px 14px;border-radius:8px;margin-bottom:16px}
.alert.err{background:var(--danger-l);color:var(--danger)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
/* stepper */
.stepper{display:flex;gap:0;overflow-x:auto;padding:4px 0}
.step{flex:1;min-width:120px;text-align:center;position:relative;padding:0 6px}
.step:not(:last-child)::after{content:'';position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:var(--line)}
.step.done:not(:last-child)::after{background:var(--ok)}
.dot{width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:#eef0f3;color:var(--mute);font-weight:700}
.step.done .dot{background:var(--ok);color:#fff}
.step.current .dot{background:var(--warn);color:#fff;box-shadow:0 0 0 4px var(--warn-l)}
.step.rejected .dot{background:var(--danger);color:#fff}
.step .lbl{font-weight:600;font-size:13px}.step .sub{font-size:11px;color:var(--mute)}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.stat .n{font-size:28px;font-weight:700}.stat .t{color:var(--mute);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.bar-row{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center;margin:8px 0}
.bar{background:#eef0f3;border-radius:6px;height:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;color:#fff;opacity:0;pointer-events:none;transition:.2s;z-index:100}
#toast.show{opacity:1}#toast.ok{background:var(--ok)}#toast.err{background:var(--danger)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:grid;place-items:center;z-index:90;font-weight:600}
/* print */
#print-area{display:none}
@media print{
  body{background:#fff}
  #app,#login-screen,#toast,#busy{display:none!important}
  #print-area{display:block}
  @page{size:A4;margin:14mm}
}
.pd{font-family:'Noto Sans Thai',sans-serif;color:#000;font-size:12px}
.pd h1{text-align:center;font-size:20px;margin-bottom:2px}
.pd .sub{text-align:center;color:#444;margin-bottom:12px}
.pd table{margin:8px 0}.pd th,.pd td{border:1px solid #888;padding:5px 7px;font-size:12px;color:#000}
.pd th{background:#eee}
.pd .meta td{border:0;padding:2px 4px}
.pd h3{font-size:13px;margin:12px 0 4px;border-bottom:1px solid #000;padding-bottom:2px}
.sigs{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.sig{border:1px solid #888;min-width:150px;flex:1;padding:8px;text-align:center;min-height:120px;page-break-inside:avoid}
.sig .role{font-weight:700}.sig .nm{margin-top:36px;border-top:1px dotted #000
