<style>
:root{--bg:#f6f4f4;--card:#fff;--ink:#1f1a1a;--mute:#6b6464;--line:#e8e2e2;--surface:#fff;--hover:#faf7f7;--chip:#f1eded;--brand:#d3121c;--brand-d:#a80d16;--brand-l:#fdeceb;--warn:#b45309;--warn-l:#fef3c7;--danger:#b42318;--danger-l:#fdecea;--ok:#15803d;--ok-l:#dcfce7;--info:#1d4ed8;--info-l:#e0e7ff}
[data-theme=teal]{--bg:#f4f6fa;--ink:#1c2433;--mute:#667085;--line:#e4e7ec;--hover:#f9fafb;--chip:#eef0f3;--brand:#0f766e;--brand-d:#0b5d57;--brand-l:#e6f4f2}
[data-theme=blue]{--bg:#f3f6fb;--ink:#1c2433;--mute:#667085;--line:#e1e7f0;--hover:#f7f9fd;--chip:#edf1f7;--brand:#1d4ed8;--brand-d:#1639a3;--brand-l:#e6edfd}
[data-theme=purple]{--bg:#f7f5fb;--ink:#201b2e;--mute:#6b6580;--line:#e8e4f0;--hover:#faf8fd;--chip:#f0edf6;--brand:#7c3aed;--brand-d:#5b21b6;--brand-l:#f0e9fe}
[data-theme=orange]{--bg:#faf6f1;--ink:#26190f;--mute:#76685c;--line:#ece3d9;--hover:#fcf9f5;--chip:#f3ede6;--brand:#d9560b;--brand-d:#a8420a;--brand-l:#fdeee3}
[data-theme=dark]{--bg:#14161a;--card:#1d2026;--surface:#1d2026;--ink:#e8eaed;--mute:#9aa0aa;--line:#2f343c;--hover:#242830;--chip:#2a2e36;--brand:#ff5a5f;--brand-d:#e0444a;--brand-l:#3a1f22;--warn:#fbbf24;--warn-l:#3b2f12;--danger:#ff7b72;--danger-l:#3d1d1b;--ok:#4ade80;--ok-l:#17321f;--info:#8ab4ff;--info-l:#1c2a4d;color-scheme:dark}
[data-theme=dark] .btn.primary,[data-theme=dark] .btn.danger,[data-theme=dark] .btn.ok{color:#14161a}
.logo{display:block;height:34px;width:auto}.logo.lg{height:64px;margin:0 auto 14px}
.prefs{display:flex;align-items:center;gap:8px}.prefs.login{justify-content:center;margin-top:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--mute);padding:4px 9px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
[data-theme=dark] .seg button.on{color:#14161a}
.sw{display:inline-flex;gap:5px}.sw button{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
h1,h2,h3{margin:0}
a{color:var(--brand);text-decoration:none}
.mute{color:var(--mute)}
.r{text-align:right}
/* login */
#login-screen{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--card);padding:32px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(16,24,40,.08)}
.login-card h1{font-size:22px;margin-bottom:4px}
.login-card .err{color:var(--danger);min-height:20px;margin:8px 0}
/* topbar */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:6px 24px;min-height:56px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.brand{font-weight:700;color:var(--brand);font-size:16px;white-space:nowrap}
.topbar nav{display:flex;gap:4px;flex:1;min-width:0}
.topbar nav a{padding:8px 14px;border-radius:8px;color:var(--mute);font-weight:500}
.topbar nav a.active,.topbar nav a:hover{background:var(--brand-l);color:var(--brand)}
.user{display:flex;align-items:center;gap:10px;font-size:13px;margin-left:auto;flex-wrap:wrap}
main{max-width:1180px;margin:0 auto;padding:24px}
/* ui */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:12px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:20px}
.page-head p{margin:2px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:500;display:inline-block}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{border:0;background:none;cursor:pointer;color:var(--danger);font-size:16px}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-l);border-color:var(--brand)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-weight:500;font-size:13px;margin-bottom:4px}
.field{margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid .span2{grid-column:span 2}
@media(max-width:600px){.grid .span2{grid-column:auto}main{padding:12px}}
.filters{display:flex;gap:10px;margin-bottom:12px}
.filters input{max-width:320px}.filters select{max-width:200px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
tbody tr[data-id]{cursor:pointer}
tbody tr[data-id]:hover{background:var(--hover)}
.tblwrap{overflow-x:auto}
.empty{text-align:center;color:var(--mute);padding:40px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.draft{background:var(--chip);color:var(--mute)}
.badge.pending{background:var(--warn-l);color:var(--warn)}
.badge.approved{background:var(--ok-l);color:var(--ok)}
.badge.rejected{background:var(--danger-l);color:var(--danger)}
.alert{padding:12px 14px;border-radius:8px;margin-bottom:16px}
.alert.err{background:var(--danger-l);color:var(--danger)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
/* stepper */
.stepper{display:flex;gap:0;overflow-x:auto;padding:4px 0}
.step{flex:1;min-width:120px;text-align:center;position:relative;padding:0 6px}
.step:not(:last-child)::after{content:'';position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:var(--line)}
.step.done:not(:last-child)::after{background:var(--ok)}
.dot{width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--chip);color:var(--mute);font-weight:700}
.step.done .dot{background:var(--ok);color:#fff}
.step.current .dot{background:var(--warn);color:#fff;box-shadow:0 0 0 4px var(--warn-l)}
.step.rejected .dot{background:var(--danger);color:#fff}
.step .lbl{font-weight:600;font-size:13px}.step .sub{font-size:11px;color:var(--mute)}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat .n{font-size:28px;font-weight:700}.stat .t{color:var(--mute);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.bar-row{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center;margin:8px 0}
.bar{background:var(--chip);border-radius:6px;height:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
input[type=radio],input[type=checkbox]{width:auto;accent-color:var(--brand)}
.kv{grid-template-columns:170px 1fr}
.btn.warn{background:var(--warn-l);border-color:#fde68a;color:var(--warn)}
.req{color:var(--danger)}
.sect{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin-bottom:14px}
.radio-row{display:flex;gap:22px;padding:8px 0;flex-wrap:wrap}
.rd{display:flex;align-items:center;gap:6px;font-weight:400;margin:0;cursor:pointer}
.ms{position:relative}
.ms-btn{width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;cursor:pointer;color:var(--ink)}
.ms-panel{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(16,24,40,.12);max-height:280px;overflow:auto;padding:6px}
.ms-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-weight:400;margin:0;cursor:pointer}
.ms-opt:hover{background:var(--brand-l)}
.att{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--hover);border:1px solid var(--line);border-radius:8px;margin-top:6px}
.att span{flex:1;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;z-index:80;padding:16px}
.modal-box{background:var(--surface);border-radius:14px;padding:20px;width:100%;max-width:560px;max-height:80vh;overflow:auto}
.draft{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}
.draft:hover{background:var(--brand-l)}
.modal-box.wide{max-width:960px}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.att-item{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.att-item img{width:100%;height:130px;object-fit:cover;border-radius:6px;cursor:zoom-in;display:block}
.att-ico{height:130px;display:grid;place-items:center;font-size:42px;background:var(--hover);border-radius:6px}
.att-ico[data-view]{cursor:pointer}
.att-name{font-size:12px;word-break:break-all;margin:6px 0}
@media print{.modal{display:none!important}}
/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;color:#fff;opacity:0;pointer-events:none;transition:.2s;z-index:100}
#toast.show{opacity:1}#toast.ok{background:var(--ok)}#toast.err{background:var(--danger)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:grid;place-items:center;z-index:90;font-weight:600}
/* print */
#print-area{display:none}
@media print{
  body{background:#fff}
  #app,#login-screen,#toast,#busy{display:none!important}
  #print-area{display:block}
  @page{size:A4;margin:14mm}
}
.pd{font-family:'Noto Sans Thai',sans-serif;color:#000;font-size:12px}
.pd h1{text-align:center;font-size:20px;margin-bottom:2px}
.pd .sub{text-align:center;color:#444;margin-bottom:12px}
.pd table{margin:8px 0}.pd th,.pd td{border:1px solid #888;padding:5px 7px;font-size:12px;color:#000}
.pd th{background:#eee}
.pd .meta td{border:0;padding:2px 4px}
.pd h3{font-size:13px;margin:12px 0 4px;border-bottom:1px solid #000;padding-bottom:2px}
.sigs{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.sig{border:1px solid #888;min-width:150px;flex:1;padding:8px;text-align:center;min-height:120px;page-break-inside:avoid}
.sig .role{font-weight:700}.sig .nm{margin-top:36px;border-top:1px dotted #000;padding-top:4px}
.sig .cm{font-size:10px;color:#444;margin-top:4px;text-align:left}
</style>

function trNode(n) {

  if (n.nodeType === 3) { const v = tr(n.data); if (v !== n.data) n.data = v; return; }
  if (n.nodeType !== 1 || /^(SCRIPT|STYLE)$/.test(n.tagName)) return;
  for (const a of ATTRS) if (n.hasAttribute(a)) { const v = tr(n.getAttribute(a)); if (v !== n.getAttribute(a)) n.setAttribute(a, v); }
  if (n.tagName === 'INPUT' && /^(button|submit)$/.test(n.type)) n.value = tr(n.value);
  n.childNodes.forEach(trNode);
}
const trTree = el => { trNode(el); return el; };
if (LANG === 'en') {
  new MutationObserver(ms => {
    for (const m of ms) {
      if (m.type === 'characterData') trNode(m.target);
      else if (m.type === 'attributes') trNode(m.target);
      else m.addedNodes.forEach(trNode);
    }
  }).observe(document.documentElement, {childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS});
  document.title = 'Promotion Request System';
  trTree(document.body);
  const _confirm = window.confirm.bind(window), _prompt = window.prompt.bind(window), _alert = window.alert.bind(window);
  window.confirm = m => _confirm(tr(m));
  window.prompt = (m, d) => _prompt(tr(m), d);
  window.alert = m => _alert(tr(m));
}

function toast(msg, type = 'ok') {
  const t = $('#toast'); t.textContent = tr(msg); t.className = 'show ' + type;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 3500);
}
function busy(on) { $('#busy').hidden = !on; }
async function guard(fn) {
  busy(true);
  try { return await fn(); }
  catch (e) { console.error(e); toast(e.message || String(e), 'err'); }
  finally { busy(false); }
}
async function fetchAll(table, order, asc = true) {
  let out = [], from = 0;
  for (;;) {
    const {data, error} = await sb.from(table).select('*').order(order, {ascending: asc}).range(from, from + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}

const group = () => me.role === 'admin' ? 'admin' : me.role === 'requester' ? 'requester' : 'approver';
const ALLOWED = {admin:['dashboard','all','users','view'], requester:['mine','new','edit','view'], approver:['inbox','done','view']};
const DEFAULT = {admin:'#/dashboard', requester:'#/mine', approver:'#/inbox'};
const NAV = {
  admin: [['dashboard','Dashboard'],['all','คำขอทั้งหมด'],['users','จัดการผู้ใช้']],
  requester: [['mine','คำขอของฉัน'],['new','+ สร้างคำขอ']],
  approver: [['inbox','รออนุมัติ'],['done','ดำเนินการแล้ว']],

function buildNav() {
  $('#nav').innerHTML = NAV[group()].map(([p, l]) => `<a href="#/${p}" data-p="${p}">${l}</a>`).join('');

const pageOf = () => { const p = (location.hash || '').split('/'); return {page: p[1] || '', arg: p[2] || ''}; };

async function route() {
  if (!me) return;
  const {page, arg} = pageOf();
  const g = group();
  if (!ALLOWED[g].includes(page)) { location.hash = DEFAULT[g]; return; }
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.p === page));
  const main = $('#main');
  main.innerHTML = '<div class="empty">กำลังโหลด...</div>';
  window.scrollTo(0, 0);
  try {
    if (page === 'dashboard') await viewDashboard();
    else if (page === 'all') await viewList('all');
    else if (page === 'users') await viewUsers();
    else if (page === 'mine') await viewList('mine');
    else if (page === 'inbox') await viewList('inbox');
    else if (page === 'done') await viewList('done');
    else if (page === 'new') await viewForm(null);
    else if (page === 'edit') await viewForm(arg);
    else if (page === 'view') await viewDetail(arg);
  } catch (e) {
    console.error(e);
    main.innerHTML = `<div class="alert err">${esc(e.message || e)}</div>`;
  }
}

// dropdown เลือกได้หลายรายการ (ไม่เลือกเลย = ทั้งหมด)
function mountMulti(root, {options, selected, allLabel, onChange}) {
  const sel = new Set(selected || []);
  root.classList.add('ms');
  root.innerHTML = '<button type="button" class="ms-btn"></button><div class="ms-panel" hidden></div>';
  const btn = $('.ms-btn', root), panel = $('.ms-panel', root);
  const draw = () => {
    const n = sel.size;
    btn.textContent = (n === 0 ? allLabel : n <= 2 ? options.filter(o => sel.has(o)).join(', ') : `เลือกแล้ว ${n} รายการ`) + '  ▾';
    panel.innerHTML = `<label class="ms-opt"><input type="checkbox" data-all ${n === 0 ? 'checked' : ''}> ${esc(allLabel)}</label>` +
      options.map(o => `<label class="ms-opt"><input type="checkbox" value="${esc(o)}" ${sel.has(o) ? 'checked' : ''}> ${esc(o)}</label>`).join('');
  };
  btn.onclick = () => { panel.hidden = !panel.hidden; };
  panel.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.all !== undefined) sel.clear();
    else if (t.checked) sel.add(t.value); else sel.delete(t.value);
    draw(); if (onChange) onChange();
  });
  draw();
  return {get: () => options.filter(o => sel.has(o))};
}

        <div class="field"><label>เพดานส่วนลดสูงสุด (%)</label><input type="number" min="0" max="100" step="any" id="f_maxpct" value="${r.max_discount_pct ?? ''}" placeholder="ไม่จำกัด"></div>
      </div></div>

    <div class="actions"><button class="btn" id="btn-draft">💾 บันทึกแบบร่าง</button>
      <button class="btn primary" id="btn-submit">📨 ส่งขออนุมัติ</button>
      <a class="btn" href="#/mine">ยกเลิก</a></div></div>`;

  const msT = mountMulti($('#ms_treat'), {options: TREATMENTS, selected: r.treatments, allLabel: 'ใช้ได้กับทุกรายการรักษา (ค่าเริ่มต้น)', onChange: markDirty});
  const msB = mountMulti($('#ms_branch'), {options: BRANCHES, selected: r.branch_list, allLabel: 'ใช้ได้ทุกสาขา (ค่าเริ่มต้น)', onChange: markDirty});
  $('#form-root').addEventListener('input', markDirty);
  $('#form-root').addEventListener('change', markDirty);

  const prev = () => {
    const typeEl = $('#f_type');
    const prevEl = $('#flow-prev');
    if (typeEl && prevEl) {
      prevEl.textContent = 'ลำดับอนุมัติ: ' + flowText({approve_until: typeEl.value});
    }
  };
  const fType = $('#f_type');
  if (fType) {
    fType.addEventListener('change', prev);
  }
  prev();

  const fDocType = $('#f_doctype');
  if (fDocType) {
    fDocType.addEventListener('change', () => {
      const sp = fDocType.value === 'specific';
      const docInput = $('#f_doctor');
      if (docInput) {
        docInput.hidden = !sp;
        if (sp) docInput.focus(); else docInput.value = '';
      }
    });
  }

  /* ---- ไฟล์แนบ ---- */
  const drawAtt = () => {
    const attList = $('#att-list');
    if (attList) {
      attList.innerHTML = atts.map((a, i) => `<div class="att">📎 <span>${esc(a.name)}</span>
        <small class="mute">${fmtSize(a.size)}</small><button type="button" class="icon" data-rm="${i}" title="ลบไฟล์">✕</button></div>`).join('');
    }
  };
  drawAtt();
  
  const attListEl = $('#att-list');
  if (attListEl) {
    attListEl.addEventListener('click', e => {
      const b = e.target.closest('[data-rm]'); if (!b) return;
      const a = atts.splice(+b.dataset.rm, 1)[0];
      if (origPaths.has(a.path)) removed.push(a.path);
      else sb.storage.from(BUCKET).remove([a.path]).catch(() => {});
      markDirty(); drawAtt();
    });
  }

  const fFile = $('#f_file');
  if (fFile) {
    fFile.addEventListener('change', e => {
      const files = [...e.target.files]; e.target.value = '';
      guard(async () => {
        try {
          for (const f of files) {
            if (f.size > MAX_FILE) throw new Error(`ไฟล์ ${f.name} ใหญ่เกิน 10 MB`);
            const ext = (f.name.match(/\.[A-Za-z0-9]{1,8}$/) || [''])[0].toLowerCase();
            const path = `${me.id}/${crypto.randomUUID()}${ext}`;
            const {error} = await sb.storage.from(BUCKET).upload(path, f, {contentType: f.type || 'application/octet-stream'});
            if (error) throw error;
            atts.push({name: f.name, path, size: f.size, type: f.type});
            markDirty();
          }
        } finally { drawAtt(); }
      });
    });
  }

  /* ---- โหลดแบบร่างที่ค้างไว้ ---- */
  const btnLoad = $('#btn-load');
  if (btnLoad) {
    btnLoad.onclick = () => guard(async () => {
      const {data, error} = await sb.from('promotion_requests')
        .select('id,doc_no,title,status,updated_at,attachments').in('status', ['draft', 'rejected']).order('updated_at', {ascending: false});
      if (error) throw error;
      const map = Object.fromEntries(data.map(d => [d.id, d]));
      const m = openModal(`<h3>📂 แบบร่างที่ค้างไว้</h3>
        ${data.length ? data.map(d => `<div class="draft" data-id="${d.id}"><div><b>${esc(d.title || 'ไม่มีชื่อโปรโมชั่น')}</b><br>
          <small class="mute">${esc(d.doc_no)} · แก้ไขล่าสุด ${fmtDT(d.updated_at)} ·${d.status === 'rejected' ? 'ถูก Reject (รอแก้ไข)' : 'แบบร่าง'}</small></div>
          ${d.status === 'draft' ? `<button class="icon" data-del="${d.id}" title="ลบแบบร่าง">🗑</button>` : ''}</div>`).join('')
          : '<div class="empty">ไม่มีแบบร่างที่ค้างไว้</div>'}
        <div class="actions" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-close>ปิด</button></div>`);
      m.addEventListener('click', e => {
        const del = e.target.closest('[data-del]');
        if (del) {
          e.stopPropagation();
          const d = map[del.dataset.del];
          guard(async () => {
            if (!confirm(`ลบแบบร่าง ${d.doc_no} ?`)) return;
            const {error: er} = await sb.from('promotion_requests').delete().eq('id', d.id);
            if (er) throw er;
            const paths = (d.attachments || []).map(a => a.path);
            if (paths.length) { try { await sb.storage.from(BUCKET).remove(paths); } catch (_) {} }
            del.closest('.draft').remove();
            toast('ลบแบบร่างแล้ว');
            if (id === d.id) { closeModal(); dirty = false; location.hash = '#/new'; }
          });
          return;
        }
        const row = e.target.closest('.draft'); if (!row) return;
        if (dirty && !confirm('มีข้อมูลที่ยังไม่ได้บันทึก ต้องการทิ้งและโหลดแบบร่างนี้?')) return;
        closeModal();
        if (location.hash === '#/edit/' + row.dataset.id) route(); else location.hash = '#/edit/' + row.dataset.id;
      });
    });
  }

  /* ---- เก็บค่า / ตรวจสอบ / บันทึก ---- */
  const v = fid => { const el = $('#' + fid); return el ? el.value.trim() : ''; };
  const rv = name => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : ''; };
  
  const collect = () => ({
    requester_email: v('f_email'),
    requester_name: v('f_name'),
    title: v('f_title'),
    approve_until: $('#f_type') ? $('#f_type').value : 'excom',
    objective: v('f_obj'),
    discount_scope: rv('scope') || 'ITEM',
    treatments: msT.get(),
    branch_list: msB.get(),
    discount_type: rv('dtype') || 'PERCENT',
    discount_value: v('f_val'),
    promo_code: v('f_code'),
    start_date: v('f_start'),
    end_date: v('f_end'),
    doctor: ($('#f_doctype') && $('#f_doctype').value === 'specific') ? v('f_doctor') : '',
    patient_group: v('f_pgroup'),
    max_uses: v('f_uses'),
    max_discount_pct: v('f_maxpct'),
    attachments: atts,
  });

  const validate = d => {
    if (!/^\S+@\S+\.\S+$/.test(d.requester_email)) throw new Error('กรุณาระบุอีเมล Microsoft 365 ให้ถูกต้อง');
    if (!d.requester_name) throw new Error('กรุณาระบุชื่อ-นามสกุล');
    if (!d.title) throw new Error('กรุณาระบุชื่อโปรโมชั่น');
    if (!d.objective) throw new Error('กรุณาระบุวัตถุประสงค์ในการทำโปรโมชัน');
    if ($('#f_doctype') && $('#f_doctype').value === 'specific' && !d.doctor) throw new Error('กรุณาระบุชื่อแพทย์เฉพาะทาง');
    const val = Number(d.discount_value);
    if (!(val > 0)) throw new Error('กรุณาระบุมูลค่าส่วนลด');
    if (d.discount_type === 'PERCENT' && val > 100) throw new Error('ส่วนลดเปอร์เซ็นต์ต้องไม่เกิน 100');
    if (d.start_date && d.end_date && d.end_date < d.start_date) throw new Error('วันสิ้นสุดต้องไม่ก่อนวันเริ่มต้น');
    if (d.max_uses !== '' && (!Number.isInteger(Number(d.max_uses)) || Number(d.max_uses) < 1)) throw new Error('จำนวนครั้งที่ใช้ได้ต้องเป็นจำนวนเต็มตั้งแต่ 1');
    if (d.max_discount_pct !== '' && !(Number(d.max_discount_pct) > 0 && Number(d.max_discount_pct) <= 100)) throw new Error('เพดานส่วนลดสูงสุดต้องอยู่ระหว่าง 0-100%');
  };

  const save = submit => guard(async () => {
    const d = collect();
    if (submit) {
      validate(d);
      if (!confirm(`ส่งขออนุมัติ?\nลำดับ: ${flowText(d)}`)) return;
    }
    const {data: newId, error} = await sb.rpc('save_request', {p_id: id || null, p_data: d, p_submit: submit});
    if (error) throw error;
    if (removed.length) { try { await sb.storage.from(BUCKET).remove(removed); } catch (_) {} }
    dirty = false;
    if (submit) { toast('ส่งขออนุมัติเรียบร้อย'); location.hash = '#/mine'; }
    else {
      toast('บันทึกแบบร่างแล้ว');
      if (location.hash === '#/edit/' + newId) route(); else location.hash = '#/edit/' + newId;
    }
  });

  const btnDraft = $('#btn-draft');
  if (btnDraft) btnDraft.onclick = () => save(false);
  const btnSubmit = $('#btn-submit');
  if (btnSubmit) btnSubmit.onclick = () => save(true);
}

/* ================= DETAIL ================= */
function detailRows(r, forPrint) {
  const att = r.attachments || [];
  const attHtml = att.length
    ? att.map(a => forPrint ? esc(a.name) : `<a href="#" data-path="${esc(a.path)}">📎 ${esc(a.name)}</a>`).join(forPrint ? ', ' : '<br>')
    : '-';
  return [
    ['ผู้ขอ', `${esc(r.created_by_name)}${r.requester_email ? ' (' + esc(r.requester_email) + ')' : ''}`],
    ['ชื่อโปรโมชั่น', esc(r.title || '-')],
    ['ประเภทโปรโมชัน', esc(PROMO_TYPES[r.approve_until] || ROLE_LABEL[r.approve_until])],
    ['วัตถุประสงค์', nl(r.objective) || '-'],
    ['ขอบเขตส่วนลด', esc(SCOPE_LABEL[r.discount_scope] || '-')],
    ['จำกัดรายการรักษา', esc(listText(r.treatments, 'ใช้ได้กับทุกรายการรักษา'))],
    ['จำกัดสาขา', esc(listText(r.branch_list, 'ใช้ได้ทุกสาขา'))],
    ['มูลค่าส่วนลด', `<b>${esc(discText(r))}</b> (${r.discount_type === 'AMOUNT' ? 'จำนวนเงิน' : 'เปอร์เซ็นต์'})`],
    ['รหัสส่วนลด (Code)', esc(r.promo_code) || 'ไม่ระบุ'],
    ['ช่วงเวลาที่ใช้ได้', periodText(r)],
    ['เฉพาะแพทย์', r.doctor ? 'แพทย์เฉพาะทาง: ' + esc(r.doctor) : 'แพทย์ทุกคน'],
    ['เฉพาะกลุ่มคนไข้', esc(r.patient_group) || 'คนไข้ทุกกลุ่ม'],
    ['จำนวนครั้งที่ใช้ได้', r.max_uses ? fmtNum(r.max_uses) + ' ครั้ง' : 'ไม่จำกัด'],
    ['เพดานส่วนลดสูงสุด', r.max_discount_pct ? fmtNum(r.max_discount_pct) + '%' : 'ไม่จำกัด'],
    ['เอกสารแนบ', attHtml],
  ];
}

async function viewDetail(id) {
  const [{data: r, error}, {data: ap}] = await Promise.all([
    sb.from('promotion_requests').select('*').eq('id', id).single(),
    sb.from('approvals').select('*').eq('request_id', id).order('created_at').order('id'),
  ]);
  if (error || !r) throw new Error('ไม่พบคำขอ หรือคุณไม่มีสิทธิ์ดู');
  const hist = ap || [];

  // ประวัติรอบล่าสุด (นับจาก submit/resubmit ครั้งล่าสุด)
  let startIdx = -1;
  hist.forEach((a, i) => { if (a.action === 'submit' || a.action === 'resubmit') startIdx = i; });
  const cycle = startIdx >= 0 ? hist.slice(startIdx) : [];
  const lastReject = [...hist].reverse().find(a => a.action === 'reject');

  const stepHtml = [`<div class="step ${r.submitted_at ? 'done' : ''}"><div class="dot">${r.submitted_at ? '✓' : '1'}</div>
    <div class="lbl">ผู้ขอ</div><div class="sub">${esc(r.created_by_name)}<br>${r.submitted_at ? fmtDT(r.submitted_at) : 'ยังไม่ส่ง'}</div></div>`]
    .concat(flowOf(r).map((s, i) => {
      const a = cycle.find(x => x.step === s && x.action === 'approve');
      const rj = cycle.find(x => x.step === s && x.action === 'reject');
      const st = a ? 'done' : rj ? 'rejected' : (r.status === 'pending' && r.current_step === s) ? 'current' : '';
      const sub = a ? `${esc(a.actor_name)}<br>${fmtDT(a.created_at)}` : rj ? `${esc(rj.actor_name)}<br>Reject` : st === 'current' ? 'รอดำเนินการ' : '-';
      return `<div class="step ${st}"><div class="dot">${a ? '✓' : rj ? '✕' : i + 2}</div><div class="lbl">${ROLE_LABEL[s]}</div><div class="sub">${sub}</div></div>`;
    })).join('');

  const canAct = r.status === 'pending' && r.current_step === me.role;
  const isOwner = r.created_by === me.id;
  const canEdit = isOwner && ['draft', 'rejected'].includes(r.status);
  const canDelete = me.role === 'admin' || (isOwner && r.status === 'draft');

  // ไฟล์แนบ: ขอ signed URL (อายุ 1 ชม.) เพื่อพรีวิวรูป/PDF ในหน้า
  // ถ้าขอไม่ได้จะแสดงสาเหตุจริงในการ์ด (เช่น สิทธิ์ Storage ไม่ครบ) แทนข้อความกว้าง ๆ
  const attList = r.attachments || [];
  let attView = [];
  if (attList.length) {
    const {data: urls, error: urlErr} = await sb.storage.from(BUCKET).createSignedUrls(attList.map(a => a.path), 3600);
    if (urlErr) console.warn('createSignedUrls:', urlErr);
    const byPath = Object.fromEntries((urls || []).map(x => [x.path, x]));
    attView = attList.map(a => {
      const hit = byPath[a.path];
      const u = hit && !hit.error ? hit.signedUrl : null;
      const err = u ? '' : ((hit && hit.error) || (urlErr && urlErr.message) || 'ไม่พบไฟล์ หรือไม่มีสิทธิ์เข้าถึง');
      const isImg = /^image\//.test(a.type || '') || /\.(png|jpe?g|gif|webp|bmp)$/i.test(a.name || '');
      const isPdf = a.type === 'application/pdf' || /\.pdf$/i.test(a.name || '');
      return {...a, url: u, err, kind: isImg ? 'img' : isPdf ? 'pdf' : 'file'};
    });
  }
  const attHtml = attView.length ? `<div class="card"><h3>📎 เอกสารแนบ (${attView.length})</h3><div class="att-grid">${attView.map((a, i) => !a.url
    ? `<div class="att-item"><div class="att-ico">⚠️</div><div class="att-name">${esc(a.name)}<br><small style="color:var(--danger)">เปิดไฟล์ไม่ได้: ${esc(a.err)}</small></div></div>`
    : `<div class="att-item">${a.kind === 'img' ? `<img src="${esc(a.url)}" data-view="${i}" alt="${esc(a.name)}" loading="lazy">`
        : a.kind === 'pdf' ? `<div class="att-ico" data-view="${i}">📄</div>` : '<div class="att-ico">📎</div>'}
      <div class="att-name">${esc(a.name)}<br><small class="mute">${fmtSize(a.size)}</small></div>
      <div>${a.kind !== 'file' ? `<button class="btn sm" data-view="${i}">ดู</button> ` : ''}<button class="btn sm" data-dl="${i}">ดาวน์โหลด</button></div></div>`).join('')}</div></div>` : '';

  $('#main').innerHTML = `
    <div class="page-head"><div><a href="${DEFAULT[group()]}">← กลับ</a><h2 style="margin-top:6px">${esc(r.title || r.objective)}</h2>
      <p class="mute">${esc(r.doc_no)} · ${statusBadge(r)}</p></div>
      <div class="actions">
        ${canEdit ? `<a class="btn primary" href="#/edit/${r.id}">✏️ ${r.status === 'rejected' ? 'แก้ไขและส่งใหม่' : 'แก้ไข'}</a>` : ''}
        ${r.status === 'approved' ? '<button class="btn primary" id="btn-pdf">💾 บันทึกเป็น PDF</button><button class="btn primary" id="btn-print">🖨 พิมพ์เอกสาร</button>' : ''}
        ${canDelete ? '<button class="btn danger" id="btn-del">ลบ</button>' : ''}
      </div></div>
    ${r.status === 'rejected' && lastReject ? `<div class="alert err"><b>ถูก Reject โดย ${ROLE_LABEL[lastReject.step]} (${esc(lastReject.actor_name)}) · ${fmtDT(lastReject.created_at)}</b><br>${nl(lastReject.comment)}</div>` : ''}
    <div class="card"><h3>สถานะการอนุมัติ <span class="mute" style="font-weight:400">· ${flowText(r)}</span></h3><div class="stepper">${stepHtml}</div></div>
    ${canAct ? `<div class="card" style="border-color:var(--warn)"><h3>รอการอนุมัติจากคุณ (${ROLE_LABEL[me.role]})</h3>
      <div class="field"><label>ความคิดเห็น (จำเป็นเมื่อ Reject)</label><textarea id="cmt"></textarea></div>
      <div class="actions"><button class="btn ok" id="btn-ap">✓ อนุมัติ</button><button class="btn danger" id="btn-rj">✕ Reject (ส่งกลับแก้ไข)</button></div></div>` : ''}
    <div class="card"><h3>รายละเอียดคำขอ</h3><dl class="kv">
      ${detailRows(r).filter(([k]) => k !== 'เอกสารแนบ').map(([k, val]) => `<dt>${k}</dt><dd>${val}</dd>`).join('')}</dl></div>
    ${attHtml}
    <div class="card"><h3>ประวัติการดำเนินการ</h3>${hist.length ? `<div class="tblwrap"><table><thead><tr><th>เวลา</th><th>ขั้นตอน</th><th>การดำเนินการ</th><th>โดย</th><th>ความคิดเห็น</th></tr></thead><tbody>
      ${hist.map(a => `<tr><td>${fmtDT(a.created_at)}</td><td>${a.step === 'requester' ? 'ผู้ขอ' : ROLE_LABEL[a.step]}</td>
        <td><span class="badge ${a.action === 'reject' ? 'rejected' : a.action === 'approve' ? 'approved' : 'draft'}">${ACTION_LABEL[a.action]}</span></td>
        <td>${esc(a.actor_name)}</td><td>${nl(a.comment) || '-'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="mute">ยังไม่มีประวัติ</div>'}</div>`;

  // พรีวิว / ดาวน์โหลดไฟล์แนบ
  // โหลดไฟล์เป็น blob ก่อน เพราะ Storage ส่ง header ที่ทำให้ PDF แสดงใน iframe/แท็บใหม่ตรง ๆ ไม่ได้ในบางเบราว์เซอร์
  const fetchBlob = async a => {
    const res = await fetch(a.url);
    if (!res.ok) throw new Error(`โหลดไฟล์ไม่สำเร็จ (${res.status})`);
    return res.blob();
  };
  $$('[data-view]').forEach(el => el.onclick = () => guard(async () => {
    const a = attView[+el.dataset.view];
    let src = a.url;
    if (a.kind === 'pdf') {
      try { src = URL.createObjectURL(new Blob([await fetchBlob(a)], {type: 'application/pdf'})); }
      catch (e) { console.warn(e); }
    }
    const body = a.kind === 'img'
      ? `<img src="${esc(src)}" alt="${esc(a.name)}" style="max-width:100%;display:block;margin:0 auto">`
      : `<iframe src="${esc(src)}" style="width:100%;height:75vh;border:0"></iframe>`;
    openModal(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px">
      <b style="word-break:break-all">${esc(a.name)}</b>
      <span style="white-space:nowrap"><a class="btn sm" href="${esc(src)}" target="_blank" rel="noopener">เปิดในแท็บใหม่</a> <button class="btn sm" data-close>ปิด</button></span></div>${body}`, 'wide');
  }));
  $$('[data-dl]').forEach(el => el.onclick = () => guard(async () => {
    const a = attView[+el.dataset.dl];
    const url = URL.createObjectURL(await fetchBlob(a));
    const link = document.createElement('a');
    link.href = url; link.download = a.name || 'file';          // ใช้ชื่อไฟล์เดิมที่ผู้ขอแนบ
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  }));
  if ($('#btn-print')) $('#btn-print').onclick = () => printDoc(r, cycle);
  if ($('#btn-pdf')) $('#btn-pdf').onclick = () => guard(() => savePdf(r, cycle));
  if ($('#btn-del')) $('#btn-del').onclick = () => guard(async () => {
    if (!confirm(`ลบคำขอ ${r.doc_no} ? การลบไม่สามารถกู้คืนได้`)) return;
    const {error: e} = await sb.from('promotion_requests').delete().eq('id', r.id);
    if (e) throw e;
    const paths = (r.attachments || []).map(a => a.path);
    if (paths.length && isOwner) { try { await sb.storage.from(BUCKET).remove(paths); } catch (_) {} }
    toast('ลบแล้ว'); location.hash = DEFAULT[group()];
  });
  const act = action => guard(async () => {
    const comment = ($('#cmt').value || '').trim();
    if (action === 'reject' && !comment) throw new Error('กรุณาระบุเหตุผลที่ Reject');
    if (!confirm(action === 'approve' ? 'ยืนยันอนุมัติ?' : 'ยืนยัน Reject และส่งกลับให้ผู้ขอแก้ไข?')) return;
    const {error: e} = await sb.rpc('act_request', {p_id: r.id, p_action: action, p_comment: comment});
    if (e) throw e;
    toast(action === 'approve' ? 'อนุมัติเรียบร้อย' : 'ส่งกลับให้ผู้ขอแก้ไขแล้ว');
    location.hash = DEFAULT[group()];
  });
  if ($('#btn-ap')) { $('#btn-ap').onclick = () => act('approve'); $('#btn-rj').onclick = () => act('reject'); }
}

/* ================= PRINT ================= */
function buildDocHtml(r, cycle) {
  const sigs = [`<div class="sig"><div class="role">ผู้ขอ (Requester)</div><div class="nm">${esc(r.created_by_name)}</div><div class="cm">${fmtDT(r.submitted_at)}</div></div>`]
    .concat(flowOf(r).map(s => {
      const a = cycle.find(x => x.step === s && x.action === 'approve');
      return `<div class="sig"><div class="role">${ROLE_LABEL[s]}</div><div class="nm">${a ? esc(a.actor_name) : '&nbsp;'}</div>
        <div class="cm">${a ? 'อนุมัติเมื่อ ' + fmtDT(a.created_at) : ''}${a && a.comment ? '<br>' + nl(a.comment) : ''}</div></div>`;
    })).join('');
  return `<div class="pd">
    <img class="plogo" src="${LOGO}" alt="" style="height:48px;display:block;margin:0 auto 6px">
    <h1>ใบขออนุมัติส่วนลดโปรโมชัน</h1><div class="sub">Tantatat Clinic Company Limited · Promotion Discount Approval Request</div>
    <table class="meta"><tr><td><b>เลขที่เอกสาร:</b> ${esc(r.doc_no)}</td><td><b>วันที่ขอ:</b> ${fmtDate(r.submitted_at || r.created_at)}</td></tr>
      <tr><td><b>ผู้ขอ:</b> ${esc(r.created_by_name)}</td><td><b>อนุมัติครบเมื่อ:</b> ${fmtDate(r.completed_at)}</td></tr></table>
    <h3>รายละเอียดโปรโมชัน</h3>
    <table>${detailRows(r, true).map(([k, val]) => `<tr><th style="width:28%;text-align:left">${k}</th><td>${val}</td></tr>`).join('')}</table>
    <h3>การอนุมัติ</h3><div class="sigs">${sigs}</div>
    <div class="sub" style="margin-top:14px;font-size:10px">ออกเอกสารจากระบบเมื่อ ${fmtDT(new Date().toISOString())}</div></div>`;
}

// พิมพ์ (เปิดหน้าต่างพิมพ์ของเบราว์เซอร์ — เลือก "Save as PDF" ได้ด้วย)
function printDoc(r, cycle) {
  $('#print-area').innerHTML = buildDocHtml(r, cycle); trTree($('#print-area'));
  window.print();
}

// บันทึกเป็นไฟล์ PDF (A4) ดาวน์โหลดทันที ตั้งชื่อไฟล์ตามเลขที่เอกสาร
async function savePdf(r, cycle) {
  if (!window.html2pdf) throw new Error('โหลดไลบรารี PDF ไม่สำเร็จ ลองรีเฟรชหน้า หรือใช้ปุ่มพิมพ์แล้วเลือก Save as PDF');
  const stage = document.createElement('div');
  // วางนอกจอ (ไม่ใช้ display:none เพราะจะ render ไม่ได้) กว้างเท่าพื้นที่เนื้อหา A4 (190mm ≈ 718px)
  stage.style.cssText = 'position:absolute;left:-10000px;top:0;width:718px;background:#fff;';
  stage.innerHTML = buildDocHtml(r, cycle);
  trTree(stage);
  document.body.appendChild(stage);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await Promise.all($$('img', stage).map(i => i.decode ? i.decode().catch(() => {}) : 0));
    await html2pdf().set({
      margin: [10, 10, 10, 10],
      filename: `${r.doc_no || 'promotion-request'}.pdf`,
      image: {type: 'jpeg', quality: 0.98},
      html2canvas: {scale: 2, useCORS: true, backgroundColor: '#ffffff'},
      jsPDF: {unit: 'mm', format: 'a4', orientation: 'portrait'},
      pagebreak: {mode: ['css', 'legacy'], avoid: ['.sig', 'tr', 'h3']},
    }).from(stage.firstElementChild).save();
    toast('บันทึก PDF แล้ว');
  } finally { stage.remove(); }
}

/* ================= EXCEL ================= */
async function exportExcel(rows, filename) {
  if (!window.XLSX) throw new Error('โหลดไลบรารี Excel ไม่สำเร็จ ลองรีเฟรชหน้า');
  if (!rows.length) throw new Error('ไม่มีข้อมูลให้ export');
  const ap = await fetchAll('approvals', 'created_at');
  const byId = Object.fromEntries(rows.map(r => [r.id, r]));

  const s1 = rows.map(r => ({
    'เลขที่': r.doc_no, 'ผู้ขอ': r.created_by_name, 'อีเมล': r.requester_email, 'ชื่อโปรโมชั่น': r.title,
    'ประเภทโปรโมชัน': PROMO_TYPES[r.approve_until] || ROLE_LABEL[r.approve_until],
    'วัตถุประสงค์': r.objective, 'ขอบเขตส่วนลด': SCOPE_LABEL[r.discount_scope],
    'จำกัดรายการรักษา': listText(r.treatments, 'ทุกรายการรักษา'), 'จำกัดสาขา': listText(r.branch_list, 'ทุกสาขา'),
    'ประเภทส่วนลด': r.discount_type === 'AMOUNT' ? 'จำนวนเงิน (บาท)' : 'เปอร์เซ็นต์ (%)',
    'มูลค่าส่วนลด': r.discount_value === null ? null : Number(r.discount_value),
    'รหัสส่วนลด': r.promo_code, 'วันเริ่มต้น': fmtDate(r.start_date), 'วันสิ้นสุด': fmtDate(r.end_date),
    'เฉพาะแพทย์': r.doctor ? 'แพทย์เฉพาะทาง: ' + r.doctor : 'แพทย์ทุกคน', 'กลุ่มคนไข้': r.patient_group || 'ทุกกลุ่ม',
    'จำนวนครั้งที่ใช้ได้': r.max_uses ?? 'ไม่จำกัด', 'เพดานส่วนลดสูงสุด (%)': r.max_discount_pct ?? 'ไม่จำกัด',
    'จำนวนไฟล์แนบ': (r.attachments || []).length,
    'สถานะ': STATUS_LABEL[r.status], 'ขั้นตอนปัจจุบัน': r.current_step ? ROLE_LABEL[r.current_step] : '-',
    'วันที่สร้าง': fmtDT(r.created_at), 'วันที่ส่งอนุมัติ': fmtDT(r.submitted_at), 'วันที่อนุมัติครบ': fmtDT(r.completed_at),
  }));
  const s2 = ap.filter(a => byId[a.request_id]).map(a => ({
    'เลขที่': byId[a.request_id].doc_no, 'ชื่อโปรโมชั่น': byId[a.request_id].title,
    'เวลา': fmtDT(a.created_at), 'ขั้นตอน': a.step === 'requester' ? 'ผู้ขอ' : ROLE_LABEL[a.step],
    'การดำเนินการ': ACTION_LABEL[a.action], 'โดย': a.actor_name, 'ความคิดเห็น': a.comment,
  }));

  const wb = XLSX.utils.book_new();
  const add = (data, name, fallback) => {
    const ws = XLSX.utils.json_to_sheet(trRows(data.length ? data : [fallback]));
    ws['!cols'] = Object.keys(trRows([data[0] || fallback])[0]).map(c => ({wch: Math.min(40, Math.max(12, c.length + 4))}));
    XLSX.utils.book_append_sheet(wb, ws, tr(name));
  };
  add(s1, 'คำขอ', {});
  add(s2, 'ประวัติอนุมัติ', {'เลขที่': ''});
  XLSX.writeFile(wb, filename);
  toast('Export สำเร็จ');
}

/* ================= DASHBOARD (admin) ================= */
async function viewDashboard() {
  const rows = await fetchRequests();
  const cnt = s => rows.filter(r => r.status === s).length;
  const byStep = STEPS.map(s => ({s, n: rows.filter(r => r.status === 'pending' && r.current_step === s).length}));
  const approved = rows.filter(r => r.status === 'approved');
  const today = new Date().toISOString().slice(0, 10);
  const live = approved.filter(r => (!r.start_date || r.start_date <= today) && (!r.end_date || r.end_date >= today)).length;
  const avgDays = approved.length ? approved.reduce((a, r) => a + (new Date(r.completed_at) - new Date(r.submitted_at)) / 864e5, 0) / approved.length : 0;

  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`,
      label: d.toLocaleDateString(LOCALE, {month: 'short', year: '2-digit'}), n: 0});
  }
  rows.forEach(r => {
    const d = new Date(r.created_at);
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const m = months.find(x => x.key === k); if (m) m.n++;
  });
  const bars = (list) => { const mx = Math.max(1, ...list.map(x => x.n));
    return list.map(x => `<div class="bar-row"><span>${x.label}</span><div class="bar"><i style="width:${x.n / mx * 100}%"></i></div><b>${x.n}</b></div>`).join(''); };

  const stuck = rows.filter(r => r.status === 'pending')
    .sort((a, b) => new Date(a.updated_at) - new Date(b.updated_at)).slice(0, 5);
  const recent = rows.slice(0, 8);
  const tr = r => `<tr data-id="${r.id}"><td>${esc(r.doc_no)}</td><td>${esc(r.title || r.objective)}</td><td>${esc(r.created_by_name)}</td><td>${statusBadge(r)}</td></tr>`;

  $('#main').innerHTML = `
    <div class="page-head"><div><h2>Dashboard</h2><p class="mute">ภาพรวมคำขอโปรโมชั่นทั้งหมด</p></div>
      <div class="actions"><button class="btn" id="btn-export">⬇ Export Excel (ทั้งหมด)</button></div></div>
    <div class="stats">
      <div class="stat"><div class="n">${rows.length}</div><div class="t">คำขอทั้งหมด</div></div>
      <div class="stat"><div class="n" style="color:var(--warn)">${cnt('pending')}</div><div class="t">รออนุมัติ</div></div>
      <div class="stat"><div class="n" style="color:var(--ok)">${cnt('approved')}</div><div class="t">อนุมัติแล้ว</div></div>
      <div class="stat"><div class="n" style="color:var(--danger)">${cnt('rejected')}</div><div class="t">ถูก Reject</div></div>
      <div class="stat"><div class="n">${cnt('draft')}</div><div class="t">ร่าง</div></div>
      <div class="stat"><div class="n">${live}</div><div class="t">โปรโมชันที่กำลังใช้งานอยู่</div></div>
      <div class="stat"><div class="n">${avgDays.toFixed(1)}</div><div class="t">วันเฉลี่ยกว่าจะอนุมัติครบ</div></div>
    </div>
    <div class="two">
      <div class="card"><h3>คำขอที่ค้างอยู่ในแต่ละขั้น</h3>${bars(byStep.map(x => ({label: ROLE_LABEL[x.s], n: x.n})))}</div>
      <div class="card"><h3>คำขอที่สร้าง 6 เดือนล่าสุด</h3>${bars(months)}</div>
    </div>
    <div class="two">
      <div class="card"><h3>ค้างนานที่สุด</h3>${stuck.length ? `<table><tbody>${stuck.map(r => `<tr data-id="${r.id}"><td>${esc(r.doc_no)}</td><td>${esc(r.title || r.objective)}</td>
        <td>รอ ${ROLE_LABEL[r.current_step]}</td><td class="r">${Math.floor((Date.now() - new Date(r.updated_at)) / 864e5)} วัน</td></tr>`).join('')}</tbody></table>` : '<div class="mute">ไม่มีรายการค้าง 🎉</div>'}</div>
      <div class="card"><h3>คำขอล่าสุด</h3>${recent.length ? `<table><tbody>${recent.map(tr).join('')}</tbody></table>` : '<div class="mute">ยังไม่มีคำขอ</div>'}</div>
    </div>`;
  $$('#main tr[data-id]').forEach(t => t.onclick = () => location.hash = '#/view/' + t.dataset.id);
  $('#btn-export').onclick = () => guard(() => exportExcel(rows, `promotion-requests-${new Date().toISOString().slice(0, 10)}.xlsx`));
}

/* ================= USERS (admin) ================= */
const randomPw = () => { const c = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = '';
  const a = crypto.getRandomValues(new Uint32Array(12)); a.forEach(n => s += c[n % c.length]); return s; };

async function viewUsers() {
  const {data: users, error} = await sb.from('profiles').select('*').order('created_at');
  if (error) throw error;
  const roleOpts = sel => Object.entries(ROLE_LABEL).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v}</option>`).join('');

  $('#main').innerHTML = `
    <div class="page-head"><div><h2>จัดการผู้ใช้</h2><p class="mute">สร้างบัญชีและกำหนดระดับให้แต่ละคน</p></div></div>
    <div class="card"><h3>สร้างผู้ใช้ใหม่</h3>
      <form id="uf" class="grid">
        <div class="field"><label>ชื่อ-นามสกุล</label><input id="u_name" required></div>
        <div class="field"><label>อีเมล</label><input type="email" id="u_email" required></div>
        <div class="field"><label>ระดับ (Role)</label><select id="u_role">${roleOpts('requester')}</select></div>
        <div class="field"><label>รหัสผ่านเริ่มต้น</label><div style="display:flex;gap:6px"><input id="u_pw" required minlength="8"><button type="button" class="btn sm" id="u_gen">สุ่ม</button></div></div>
        <div class="field" style="align-self:end"><button class="btn primary">+ สร้างผู้ใช้</button></div>
      </form></div>
    <div class="card"><h3>ผู้ใช้ทั้งหมด (${users.length})</h3><div class="tblwrap"><table><thead><tr><th>ชื่อ</th><th>อีเมล</th><th>Role</th><th>ใช้งาน</th><th></th></tr></thead><tbody id="ubody">
      ${users.map(u => { const self = u.id === me.id; return `<tr data-uid="${u.id}">
        <td><input class="n" value="${esc(u.full_name)}"></td><td>${esc(u.email)}</td>
        <td><select class="ro" ${self ? 'disabled' : ''}>${roleOpts(u.role)}</select></td>
        <td><input type="checkbox" class="ac" style="width:auto" ${u.active ? 'checked' : ''} ${self ? 'disabled' : ''}></td>
        <td style="white-space:nowrap"><button class="btn sm" data-a="save">บันทึก</button>
          <button class="btn sm" data-a="pw">รีเซ็ตรหัส</button>
          ${self ? '' : '<button class="btn sm danger" data-a="del">ลบ</button>'}</td></tr>`; }).join('')}
    </tbody></table></div></div>`;

  $('#u_gen').onclick = () => { $('#u_pw').value = randomPw(); };
  $('#uf').addEventListener('submit', e => { e.preventDefault(); guard(async () => {
    const email = $('#u_email').value.trim();
    const password = $('#u_pw').value;
    const full_name = $('#u_name').value.trim();
    const role = $('#u_role').value;

    const { data: authData, error: authErr } = await sb.auth.signUp({
      email,
      password,
      options: { data: { full_name } }
    });
    if (authErr) throw authErr;

    if (authData.user) {
      const { error: profileErr } = await sb.from('profiles').update({
        full_name,
        role,
        active: true
      }).eq('id', authData.user.id);
      if (profileErr) throw profileErr;
    }

    toast(`สร้างผู้ใช้สำเร็จ (รหัสผ่าน: ${password})`);
    await viewUsers();
  }); });
  $('#ubody').addEventListener('click', e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const tr = b.closest('tr'), id = tr.dataset.uid;
    guard(async () => {
      if (b.dataset.a === 'save') {
        const {error: er} = await sb.from('profiles').update({
          full_name: $('.n', tr).value.trim(), role: $('.ro', tr).value, active:$('.ac', tr).checked}).eq('id', id);
        if (er) throw er;
        toast('บันทึกแล้ว');
      } else if (b.dataset.a === 'pw') {
        const pw = prompt('รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)', randomPw());
        if (!pw) return;
        if (pw.length < 8) throw new Error('รหัสผ่านต้องอย่างน้อย 8 ตัวอักษร');
        const {error: er} = await sb.auth.updateUser({password: pw});
        if (er) throw er;
        toast('เปลี่ยนรหัสผ่านสำเร็จ');
      } else if (b.dataset.a === 'del') {
        if (!confirm('ลบข้อมูลโปรไฟล์ผู้ใช้นี้ออกจากระบบ?')) return;
        const {error: er} = await sb.from('profiles').delete().eq('id', id);
        if (er) throw er;
        toast('ลบผู้ใช้แล้ว');
        await viewUsers();
      }
    });
  });
}
